ekf_filter_node_odom:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.10
    transform_timeout: 0.0
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu_msg
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false

    odom0: /wheel_odom
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

