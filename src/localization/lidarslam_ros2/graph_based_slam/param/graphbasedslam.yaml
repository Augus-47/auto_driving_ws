graph_based_slam:
    ros__parameters:
   
    # 基本框架参数
      global_frame_id: "map"
      robot_frame_id: "base_link"
      odom_frame_id: "odom"
    
      registration_method: "GICP"
      ndt_resolution: 1.5
      voxel_leaf_size: 0.2
      loop_detection_period: 3000
      threshold_loop_closure_score: 1.5
      distance_loop_closure: 30.0
      debug_flag: false
